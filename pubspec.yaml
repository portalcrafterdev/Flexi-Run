name: flexirun
description: "Flexi Run - a 2D endless runner and shape-matching puzzle for kids aged 6 to 10."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flame: ^1.18.0
  flame_audio: ^2.10.0
  shared_preferences: ^2.2.0
  google_mobile_ads: ^9.1.0
  games_services: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flame_test: ^2.3.0

flutter:
  uses-material-design: true

  # Real art drops in here. Until it arrives every sprite is generated in code
  # by core/placeholder_art.dart, so swapping is a file change and nothing else.
  assets:
    - assets/images/bg/
    - assets/images/player/
    - assets/images/walls/
    - assets/images/ui/
    - assets/audio/
