<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; }
    a { color: #2F8A3C; } a:hover { color: #21682c; }
    .slab { position: relative; border-radius: 22px; border: 3px solid #FFFFFF;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            overflow: hidden; color: #FFFFFF; font-weight: 800; height: 44px; }
    .slab .gloss { position: absolute; left: 5px; right: 5px; top: 3px; height: 32%;
                   border-radius: 18px; background: rgba(255,255,255,0.3); }
    .slab span, .slab svg { position: relative; }
    .slab .t { text-shadow: 0 1.5px 2px rgba(23,58,42,0.35); letter-spacing: 1.6px; font-size: 17px; }
    .play { background: linear-gradient(180deg,#8FDD77 0%,#4FB84F 62%,#3E9741 100%);
            box-shadow: 0 5px 0 #2F8A3C, 0 8px 12px rgba(16,42,24,0.22); }
    .howto { background: linear-gradient(180deg,#85CFF2 0%,#4A9BD8 62%,#3A83BC 100%);
             box-shadow: 0 5px 0 #2C6FAE, 0 8px 12px rgba(16,42,24,0.22); }
    /* The volume rail. Five steps, not a continuous slider: a child dragging a
       thumb along a bar cannot tell what they have set, and five taps can. */
    .rail { flex: 1; height: 10px; border-radius: 6px; background: #E3EBE6; position: relative; }
    .fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
    .thumb { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
             background: #FFFFFF; border: 2.5px solid currentColor; transform: translate(-50%,-50%); }
  </style>
</helmet>

<div style="position: relative; width: 800px; height: 360px; overflow: hidden; background: linear-gradient(180deg,#3D7CD6 0%,#5FC0EC 48%,#AEE5F3 62%);">

  <svg viewBox="0 0 800 360" style="position: absolute; inset: 0;" aria-hidden="true">
    <path d="M0 214 Q 220 198 460 216 T 800 208 L800 360 L0 360 Z" fill="#9CCBA1"></path>
    <path d="M0 246 Q 260 230 560 250 T 800 242 L800 360 L0 360 Z" fill="#7FBC65"></path>
    <path d="M0 290 Q 300 272 620 294 T 800 286 L800 360 L0 360 Z" fill="#56A85E"></path>
    <polygon points="372,214 428,214 640,360 160,360" fill="#D9BE8E"></polygon>
    <g>
      <rect x="252" y="200" width="240" height="126" rx="8" fill="#C06B4A"></rect>
      <g stroke="#A3573A" stroke-width="2.4"><path d="M252 232 H492 M252 264 H492 M252 296 H492"></path></g>
      <rect x="340" y="230" width="64" height="64" rx="14" fill="#7FBC65"></rect>
    </g>
    <g fill="#4B9450"><polygon points="82,272 66,246 98,246"></polygon><polygon points="726,278 710,252 742,252"></polygon></g>
  </svg>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.4);"></div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 330px; background: #FFFDF5; border: 2.5px solid #F2C14E; border-radius: 22px; padding: 15px; box-sizing: border-box; box-shadow: 0 8px 20px rgba(16,42,24,0.34);">

    <div style="text-align: center; font-size: 26px; font-weight: 800; color: #46564E; line-height: 1.1;">Paused</div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px;">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,1.5 15,8.8 22.8,8.8 16.5,13.6 18.8,21.4 12,16.6 5.2,21.4 7.5,13.6 1.2,8.8 9,8.8" fill="#F2C14E"></polygon></svg>
      <span style="font-size: 13px; font-weight: 700; color: #6E7D75;">Score</span>
      <span style="font-size: 24px; font-weight: 800; color: #46564E;">80</span>
    </div>

    <!-- Sound sits here as well as in Settings, because this is where a parent
         reaches for it: mid-run, in a quiet room, without leaving the game. -->
    <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 9px; color: #41C275;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46564E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7"></path></svg>
        <div class="rail"><div class="fill" style="width: 80%; background: #41C275;"></div><div class="thumb" style="left: 80%;"></div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 9px; color: #4A93E8;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46564E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l10-2v13"></path><circle cx="6.5" cy="18" r="2.6"></circle><circle cx="16.5" cy="16" r="2.6"></circle></svg>
        <div class="rail"><div class="fill" style="width: 40%; background: #4A93E8;"></div><div class="thumb" style="left: 40%;"></div></div>
      </div>
    </div>

    <div style="margin-top: 13px; display: flex; flex-direction: column; gap: 11px;">
      <div class="slab play">
        <div class="gloss"></div>
        <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4 20,12 7,20" fill="#FFFFFF"></polygon></svg>
        <span class="t">KEEP GOING</span>
      </div>
      <div class="slab howto">
        <div class="gloss"></div>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M6 10v9h12v-9"></path></svg>
        <span class="t">MENU</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
