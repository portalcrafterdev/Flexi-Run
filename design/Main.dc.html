<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; }
    a { color: #2F8A3C; } a:hover { color: #21682c; }
    /* The slab: lit top, body, shaded lip, white rim, gloss across the top.
       Shared by every screen so the set cannot drift apart. */
    .slab { position: relative; border-radius: 22px; border: 3px solid #FFFFFF;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            overflow: hidden; color: #FFFFFF; font-weight: 800; }
    .slab .gloss { position: absolute; left: 5px; right: 5px; top: 3px;
                   height: 32%; border-radius: 18px; background: rgba(255,255,255,0.3); }
    .slab span, .slab svg { position: relative; }
    .slab .t { text-shadow: 0 1.5px 2px rgba(23,58,42,0.35); letter-spacing: 1.6px; }
    .play { background: linear-gradient(180deg,#8FDD77 0%,#4FB84F 62%,#3E9741 100%);
            box-shadow: 0 5px 0 #2F8A3C, 0 8px 12px rgba(16,42,24,0.22); }
    .howto { background: linear-gradient(180deg,#85CFF2 0%,#4A9BD8 62%,#3A83BC 100%);
             box-shadow: 0 5px 0 #2C6FAE, 0 8px 12px rgba(16,42,24,0.22); }
    .signin { background: linear-gradient(180deg,#CFB4F0 0%,#9E7ED4 62%,#8668BE 100%);
              box-shadow: 0 5px 0 #6F52A8, 0 8px 12px rgba(16,42,24,0.22); }
    .gold { background: linear-gradient(180deg,#F7C86A 0%,#F0A93B 62%,#D9922B 100%);
            box-shadow: 0 5px 0 #B87A1E, 0 8px 12px rgba(16,42,24,0.22); }
    /* Parchment pill for the level picker. */
    .tile { border-radius: 13px; background: linear-gradient(180deg,#FDF4E2 0%,#F8EBD2 100%);
            text-align: center; padding: 6px 0 7px; }
  </style>
</helmet>

  <svg width="56" height="86" viewBox="0 0 56 86" style="position: absolute; left: 52px; top: 130px;" aria-hidden="true">

  <!-- logo -->
  <div style="position: absolute; left: 28px; top: 16px;">
    <div style="display: flex; gap: 1px; font-size: 46px; font-weight: 800; line-height: 1;">

      <span style="color: #FF9C3F; -webkit-text-stroke: 5px #2B4A5C; paint-order: stroke fill; transform: translateY(1px) rotate(2deg);">L</span>
      <span style="color: #FFD23F; -webkit-text-stroke: 5px #2B4A5C; paint-order: stroke fill; transform: translateY(-2px) rotate(-2deg);">E</span>
      <span style="color: #6FD98F; -webkit-text-stroke: 5px #2B4A5C; paint-order: stroke fill; transform: translateY(2px) rotate(3deg);">X</span>
      <span style="color: #59C2F5; -webkit-text-stroke: 5px #2B4A5C; paint-order: stroke fill; transform: translateY(-3px) rotate(-2deg);">I</span>
      <span style="width: 14px;"></span>
      <span style="color: #B99CF0; -webkit-text-stroke: 5px #2B4A5C; paint-order: stroke fill; transform: translateY(-1px) rotate(2deg);">R</span>
      <span style="color: #FF7FB6; -webkit-text-stroke: 5px #2B4A5C; paint-order: stroke fill; transform: translateY(2px) rotate(-3deg);">U</span>
      <span style="color: #FFB03F; -webkit-text-stroke: 5px #2B4A5C; paint-order: stroke fill; transform: translateY(-2px) rotate(3deg);">N</span>

    <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 7px 13px; border-radius: 18px; background: #FFFDF5; box-shadow: 0 3px 8px rgba(16,42,24,0.22); width: fit-content;">

      <span style="font-size: 13px; font-weight: 700; color: #46564E; margin-left: 2px;">Match the shape and slip through the wall!</span>

  </div>

  <!-- runner -->

    <rect x="56" y="126" width="15" height="26" rx="7" fill="#3FA9E8"></rect>
    <rect x="79" y="126" width="15" height="26" rx="7" fill="#3FA9E8"></rect>

    <circle cx="116" cy="104" r="10" fill="#3FA9E8"></circle>

      <stop offset="0%" stop-color="#BEEBFF"></stop><stop offset="45%" stop-color="#63C4F0"></stop><stop offset="100%" stop-color="#2E90D4"></stop>

    <ellipse cx="57" cy="62" rx="18" ry="11" fill="#FFFFFF" opacity="0.55" transform="rotate(-24 57 62)"></ellipse>

  <!-- controls -->
  <div style="position: absolute; right: 18px; top: 44px; width: 330px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; gap: 11px;">
      <div class="tile" style="flex: 1; border: 2.6px solid #4F9B45; box-shadow: 0 4px 0 #4F9B45;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 4px;">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFC44D"></circle><circle cx="9" cy="10" r="1.6" fill="#7A5E22"></circle><circle cx="15" cy="10" r="1.6" fill="#7A5E22"></circle><path d="M8 14 q4 4.5 8 0" stroke="#7A5E22" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>

        </div>
        <div style="font-size: 11px; font-weight: 700; color: #9C8043; margin-top: 5px;">Best 0</div>
      </div>
      <div class="tile" style="flex: 1; border: 2px solid #E4CCA4; box-shadow: 0 4px 0 #E4CCA4;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 4px;">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFC44D"></circle><circle cx="9" cy="10" r="1.6" fill="#7A5E22"></circle><circle cx="15" cy="10" r="1.6" fill="#7A5E22"></circle><path d="M8.5 14.6 q3.5 2.6 7 0" stroke="#7A5E22" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>

        </div>
        <div style="font-size: 11px; font-weight: 700; color: #9C8043; margin-top: 5px;">Best 0</div>
      </div>
      <div class="tile" style="flex: 1; border: 2px solid #E4CCA4; box-shadow: 0 4px 0 #E4CCA4;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 4px;">
