<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; }
    a { color: #2F8A3C; } a:hover { color: #21682c; }
    .step { display: flex; align-items: center; gap: 10px; }
    .num { width: 26px; height: 26px; border-radius: 50%; flex: none;
           display: flex; align-items: center; justify-content: center;
           font-size: 14px; font-weight: 800; color: #FFFFFF; }
    .copy { font-size: 13px; font-weight: 700; color: #46564E; line-height: 1.25; }
  </style>
</helmet>

<div style="position: relative; width: 800px; height: 360px; overflow: hidden; background: linear-gradient(180deg,#3D7CD6 0%,#5FC0EC 55%,#AEE5F3 100%);">

  <svg viewBox="0 0 800 360" style="position: absolute; inset: 0;" aria-hidden="true">
    <circle cx="416" cy="164" r="34" fill="#FFE9A3"></circle>
    <g fill="#A0B9E1"><polygon points="118,254 190,150 262,254"></polygon><polygon points="228,254 300,132 372,254"></polygon></g>
    <path d="M0 248 Q 200 232 420 250 T 800 242 L800 360 L0 360 Z" fill="#9AD7A6"></path>
    <path d="M0 278 Q 250 260 520 282 T 800 272 L800 360 L0 360 Z" fill="#6FC583"></path>
    <path d="M0 316 Q 280 300 600 320 T 800 312 L800 360 L0 360 Z" fill="#4FAE5B"></path>
    <path d="M330 250 L268 360 L438 360 L358 250 Z" fill="#D9BE8E"></path>
  </svg>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.4);"></div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 330px; background: #FFFDF5; border: 2.5px solid #F2C14E; border-radius: 22px; padding: 16px; box-sizing: border-box; box-shadow: 0 8px 20px rgba(16,42,24,0.34);">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 26px; font-weight: 800; color: #46564E; line-height: 1.1;">How to play</div>
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #F0F5F1; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7D75" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
    </div>

    <!-- Four steps, each numbered and each one sentence. The pictures do the
         work: a child who cannot read the line can still see the shape, the
         arrow and the wall. -->
    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 11px;">
      <div class="step">
        <div class="num" style="background: #FF7043;">1</div>
        <div class="copy">A wall comes down the path with a hole in it.</div>
      </div>
      <div class="step">
        <div class="num" style="background: #EC4899;">2</div>
        <div class="copy">Tap the shape that matches the hole.</div>
      </div>
      <div class="step">
        <div class="num" style="background: #A855F7;">3</div>
        <div class="copy">Use the arrows to get onto the right track.</div>
      </div>
      <div class="step">
        <div class="num" style="background: #41C275;">4</div>
        <div class="copy">Fit through, and keep going!</div>
      </div>
    </div>

    <!-- The rule in one picture, under the words. -->
    <div style="margin-top: 13px; padding: 9px; border-radius: 14px; background: #F2F7F3; display: flex; align-items: center; justify-content: center; gap: 12px;">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="#EC4899" stroke="#2B4A5C" stroke-width="1.6"></rect></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E7D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
      <svg width="58" height="40" viewBox="0 0 58 40" aria-hidden="true">
        <rect x="1" y="4" width="56" height="32" rx="4" fill="#C06B4A"></rect>
        <g stroke="#A3573A" stroke-width="1.6"><path d="M1 14 H57 M1 24 H57"></path></g>
        <rect x="20" y="11" width="18" height="18" rx="4" fill="#F2F7F3"></rect>
      </svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E7D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5" fill="none" stroke="#41C275" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
